plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.10-SNAPSHOT" apply false
    id "dev.ftb.plugins.ashwing" version "0.2.0"
}

ashwing {
    modName = "FTB Library"
    modId = project.mod_id

    publishing {
        curseForgeToken = providers.environmentVariable("CURSEFORGE_KEY").getOrNull()

        forClientAndServer()
        releaseFromString(providers.environmentVariable("TAG").getOrElse(""))
        minecraftVersion(project.minecraft_version)

        maven {}

        requires('architectury-api')
        optional('jei')
        optional('roughly-enough-items')

        modProject {
            fileFromTask(project(":fabric"), "jar")

            modLoader = "fabric"
            curseForgeId = project.curseforge_id_fabric.toInteger()

            requires('fabric-api')
        }

        modProject {
            fileFromTask(project(":neoforge"), "jar")

            modLoader = "neoforge"
            curseForgeId = project.curseforge_id_forge.toInteger()
        }
    }
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    version = ashwing.utils().createFtbLikeVersion(project.minecraft_version, project.mod_version)
    group = project.maven_group
    archivesBaseName = project.archives_base_name

    sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = 21

    compileJava {
        options.encoding = "UTF-8"
    }

    repositories {
        mavenCentral()
        mavenLocal()

        def repos = ashwing.repos(project)
        repos.ftb()
        repos.ftbSnapshots()
        repos.kubejs()
        repos.architectury()
        repos.curseMaven()
        repos.modmaven {
            it.includeGroup("mezz.jei")
        }
        repos.terraformers {
            it.includeGroup("dev.emi")
        }
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0-M1'
    }

    java {
        withSourcesJar()
    }
}
