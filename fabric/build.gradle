plugins {
    id 'net.fabricmc.fabric-loom'
}

loom {
    accessWidenerPath = project(":common").file("src/main/resources/ftblibrary.accesswidener")

    runs {
        configureEach {
            ideConfigGenerated = true

        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
            sourceSet("main", project(":common"))
        }
    }

    mixin {
        useLegacyMixinAp = false
    }
}

apply from: "https://raw.githubusercontent.com/FTBTeam/mods-meta/main/gradle/extra-local-mods.gradle"

repositories {
    maven {
        url = uri("https://maven.siphalor.de/")
    }

    maven {
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    api "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

//    compileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
//    localRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

    compileOnly("mezz.jei:jei-26.1.2-fabric-api:${jei_version}")
//    localRuntime("mezz.jei:jei-26.1.2-fabric:${jei_version}")

    compileOnly "de.siphalor.amecs.amecs-key-modifiers:amecs-key-modifiers-${amecs_key_modifiers_version}"
//    localRuntime "de.siphalor.amecs.amecs-bundle:amecs-bundle-${amecs_key_bundle_version}"

//    localRuntime "com.terraformersmc:modmenu:${modmenu_version}"

    include(api("de.marhali:json5-java:${json5_version}"))
}
